<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Messages in Jar 🫙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
        }
        .title-font {
            font-family: 'Bubblegum Sans', cursive;
        }
        .jar-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .button-hover {
            transition: all 0.3s ease;
        }
        .button-hover:hover {
            transform: scale(1.05) rotate(-2deg);
        }
        .button-hover:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 min-h-screen">
    <!-- Halaman Sambutan -->
    <div id="welcomePage" class="container mx-auto px-4 py-8 flex flex-col items-center justify-center min-h-screen">
        <div class="text-center mb-8">
            <div class="text-7xl mb-4 jar-animation">🫙</div>
            <h1 class="title-font text-4xl md:text-6xl text-purple-600 mb-4">365 Messages in Jar</h1>
            <p class="text-lg md:text-xl text-gray-700 font-semibold">Pilih toples pesanmu hari ini! ✨</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mt-8">
            <!-- Button Motivasi -->
            <button onclick="openCategory('motivasi')" class="button-hover bg-yellow-400 hover:bg-yellow-500 text-white rounded-3xl p-8 shadow-lg transform transition">
                <div class="text-5xl mb-3">💪</div>
                <h3 class="title-font text-2xl font-bold">Motivasi</h3>
                <p class="text-sm mt-2 opacity-90">Semangat untuk harimu!</p>
            </button>

            <!-- Button Cinta -->
            <button onclick="openCategory('cinta')" class="button-hover bg-red-400 hover:bg-red-500 text-white rounded-3xl p-8 shadow-lg transform transition">
                <div class="text-5xl mb-3">💖</div>
                <h3 class="title-font text-2xl font-bold">Ucapan Cinta</h3>
                <p class="text-sm mt-2 opacity-90">Kata-kata manis untukmu</p>
            </button>

            <!-- Button Nasihat -->
            <button onclick="openCategory('nasihat')" class="button-hover bg-blue-400 hover:bg-blue-500 text-white rounded-3xl p-8 shadow-lg transform transition">
                <div class="text-5xl mb-3">🧠</div>
                <h3 class="title-font text-2xl font-bold">Nasihat & Refleksi</h3>
                <p class="text-sm mt-2 opacity-90">Renungan bijak</p>
            </button>

            <!-- Button Doa -->
            <button onclick="openCategory('doa')" class="button-hover bg-green-400 hover:bg-green-500 text-white rounded-3xl p-8 shadow-lg transform transition">
                <div class="text-5xl mb-3">🙏</div>
                <h3 class="title-font text-2xl font-bold">Doa & Harapan</h3>
                <p class="text-sm mt-2 opacity-90">Harapan masa depan</p>
            </button>
        </div>
    </div>

    <!-- Halaman Pesan -->
    <div id="messagePage" class="hidden container mx-auto px-4 py-8 min-h-screen">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <button onclick="backToHome()" class="mb-4 text-purple-600 hover:text-purple-800 font-semibold flex items-center justify-center mx-auto">
                    <span class="text-2xl mr-2">←</span> Kembali
                </button>
                <div id="categoryIcon" class="text-6xl mb-4"></div>
                <h2 id="categoryTitle" class="title-font text-3xl md:text-5xl text-purple-600 mb-2"></h2>
                <p class="text-gray-600">Pesan <span id="dayNumber" class="font-bold">1</span> dari 365</p>
            </div>

            <!-- Card Pesan -->
            <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 mb-6 transform hover:scale-105 transition-all duration-300">
                <div class="text-center">
                    <div class="text-4xl mb-6">📜</div>
                    <p id="messageText" class="text-lg md:text-xl text-gray-800 leading-relaxed font-semibold"></p>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex gap-4 justify-center">
                <button onclick="previousMessage()" class="bg-purple-400 hover:bg-purple-500 text-white rounded-full px-8 py-4 shadow-lg font-bold transform hover:scale-105 transition">
                    ← Sebelumnya
                </button>
                <button onclick="nextMessage()" class="bg-purple-400 hover:bg-purple-500 text-white rounded-full px-8 py-4 shadow-lg font-bold transform hover:scale-105 transition">
                    Selanjutnya →
                </button>
            </div>

            <!-- Random Button -->
            <div class="text-center mt-6">
                <button onclick="randomMessage()" class="bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white rounded-full px-10 py-4 shadow-lg font-bold transform hover:scale-105 transition">
                    🎲 Pesan Acak
                </button>
            </div>

            <!-- Share Button -->
            <div class="text-center mt-4">
                <button onclick="openSharePopup()" class="bg-gradient-to-r from-blue-400 to-teal-400 hover:from-blue-500 hover:to-teal-500 text-white rounded-full px-10 py-4 shadow-lg font-bold transform hover:scale-105 transition">
                    📤 Bagikan Pesan
                </button>
            </div>
        </div>
    </div>

    <!-- Share Popup -->
    <div id="sharePopup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full transform transition-all">
            <div class="text-center mb-6">
                <h3 class="title-font text-2xl text-purple-600 mb-2">Bagikan Pesan 📤</h3>
                <p class="text-gray-600 text-sm">Pesan akan dibuat menjadi gambar</p>
            </div>

            <!-- Preview Canvas -->
            <div class="mb-6 flex justify-center">
                <canvas id="shareCanvas" class="rounded-2xl shadow-lg max-w-full" style="display: none;"></canvas>
                <img id="sharePreview" class="rounded-2xl shadow-lg max-w-full" style="display: none;" />
            </div>

            <div class="space-y-3">
                <!-- Generate Image -->
                <button onclick="generateImage()" id="generateBtn" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white rounded-2xl py-4 px-6 font-bold flex items-center justify-center gap-3 transform hover:scale-105 transition">
                    <span class="text-2xl"></span>
                    <span>Buat Gambar</span>
                </button>

                <!-- Share Buttons (hidden until image generated) -->
                <div id="shareButtons" class="hidden space-y-3">
                    <!-- Download -->
                    <button onclick="downloadImage()" class="w-full bg-blue-500 hover:bg-blue-600 text-white rounded-2xl py-4 px-6 font-bold flex items-center justify-center gap-3 transform hover:scale-105 transition">
                        <span class="text-2xl">💾</span>
                        <span>Simpan Gambar</span>
                    </button>

                    <!-- Share (Web Share API) -->
                    <button onclick="shareImage()" class="w-full bg-green-500 hover:bg-green-600 text-white rounded-2xl py-4 px-6 font-bold flex items-center justify-center gap-3 transform hover:scale-105 transition">
                        <span class="text-2xl">📤</span>
                        <span>Bagikan Gambar</span>
                    </button>
                </div>
            </div>

            <button onclick="closeSharePopup()" class="w-full mt-6 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-2xl py-3 px-6 font-semibold transform hover:scale-105 transition">
                Tutup
            </button>
        </div>
    </div>

    <!-- Hidden Canvas for Image Generation -->
    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script src="js/app.js"></script>
</body>
</html>
